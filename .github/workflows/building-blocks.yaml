name: "building blocks"
on: push

jobs:
  echo-hello:
      runs-on: ubuntu-latest
      steps:
        - name: "say hello"
          run: echo "Hello Github Actions!"
    
  echo-bye:
      runs-on: ubuntu-latest
      steps:
        - name: "success step"
          run: |
            echo "I'll success"
            exit 0
        # the upcoming command will fail. because the previous step failed
        - name: "say bye"
          run: echo "Bye Github Actions!"