name: "building blocks"
on: push

jobs:
  echo-hello:
      runs-on: ubuntu-latest
      steps:
        - name: "say hello"
          run: echo "Hello Github Actions!"
    
  echo-bye:
      runs-on: ubuntu-latest
      steps:
        - name: "failed step"
          run: |
            echo "I'll fail"
            exit 1
        # so the upcoming command will also fail
        - name: "say bye"
          run: echo "Bye Github Actions!"