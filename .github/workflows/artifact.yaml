name: artifacts
on: workflow_dispatch

jobs:
  install-package:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'
      - name: installing deps
        run: npm install  
  # test:
  #   runs-on: ubuntu-latest
  #   needs: install-package
  #   steps:
  #     - name: checkout code
  #       uses: actions/checkout@v4
  #     - name: setup node
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '26.x'
  #     - name: runnin tests
  #       run: npm run test -- --run      

  build:
    runs-on: ubuntu-latest
    needs: install-package
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'
      - name: building the app
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'
      - name: uploading 
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist
      - name: downloading   
        uses: actions/download-artifact@v4
        with:
          name: app
          path: build
      - name: show ls 
        run: ls -l