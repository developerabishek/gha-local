name: matrices
on: workflow_dispatch

jobs:
  backward-compactability:
    name: ${{matrix.os}}-${{matrix.node-version}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        node-version: [18.x, 20.x, 21.x]
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: setup node
        uses: actions/setup-node@v3
        with: 
          node-version: ${{matrix.node-version}}
      - name: performs test
        run: echo "Running test on os ${{matrix.os}} on node ${{matrix.node-version}}"

