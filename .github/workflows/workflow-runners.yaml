name: workflow-runners
on: push
jobs:
  ubuntu-echo:
    runs-on: ubuntu-latest
    steps:
      - name: show os
        run: echo "Runner os - $RUNNER_OS"
  windows-echo:
    runs-on: windows-latest
    steps:
      - name: show os 
        shell: bash
        run: echo "Runner os - $RUNNER_OS"
  mac-echo:
    runs-on: macos-latest
    steps:
      - name: show os 
        run: echo "Runner os - $RUNNER_OS"