name: third-party-actions
on: push

jobs:
  node-latest:
    runs-on: ubuntu-latest
    # defaults:
    #   run:
    #     working-directory: /app
    steps:
      # we need to checkout because workflow didn't know our code even it's in same folder
      - name: checkout code
        uses: actions/checkout@v4
      - name: printing folders
        run: ls
      - name: setting up node
        uses: actions/setup-node@v4
        with:
          node-version:  "26.x"
      - name: install dependencies
        run: npm install
      # you can add tests below if you have