name: caching
on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: Whether to execute cache step
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: installing dependencies
        run: npm install
      - name: building
        run: npm run build 
      - name: deploy
        run: | 
          echo "deploying to UAT"
          ls -l dist/
          