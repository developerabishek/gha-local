name: execution flow
on:
  workflow_dispatch:
    inputs:
      pass-unit-test:
        type: boolean
        description: 'Whether to run unit tests before deploying to UAT'
        default: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Lint and Build
        run: |
          echo "Running lint and build steps..."

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Run Unit Tests
        run: |
          echo "Running unit tests..."
      - name: Failing test
        if: ${{ !inputs.pass-unit-test }}
        run: |
          echo "Unit tests failed."
          exit 1

  deploy-uat:
    runs-on: ubuntu-latest
    needs: [lint-build, unit-test]
    steps:
      - name: Deploy to UAT
        run: |
          echo "Deploying to UAT..."

  e2e-test:
    runs-on: ubuntu-latest
    needs: deploy-uat
    steps:
      - name: Run E2E Tests
        run: |
          echo "Running E2E tests..."
    
  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e-test
    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to Production..."
