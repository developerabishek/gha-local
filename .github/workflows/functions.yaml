name: functions
on: [workflow_dispatch, pull_request]
jobs:
  echo-one:
    runs-on: ubuntu-latest
    steps:
      - name: print pull request title
        run: echo "${{github.event.pull_request.title}}"
      - name: print pull request labels
        run: |
          cat << EOF
          ${{toJson(github.event.pull_request.labels)}}
      - name: Bug step - success
        if: ${{success() && !cancelled() && contains(github.event.pull_request.title, 'fix')}}
        run: echo "I'm a bug fix"
      - name: Bug step - failure
        if: ${{failure() && !cancelled() && contains(github.event.pull_request.title, 'fix')}}
        run: echo "I'm not a bug fix"      
      # - name: failing step 
      #   run: exit 1
      - name: success step 
        run: exit 0
      - name: I'll be skipped
        if: ${{success()}}
        run: echo "I'll print if the previous step suceeds"
      - name: I'll execute
        if: ${{failure()}}
        run: echo "I'll print if the previous step fails"
      - name: sudo i'll execute
        if: ${{!cancelled()}}
        run: echo "I'll always print, except when the workflow is cancelled" 
      - name: I'll execute if the workflow cancelled
        if: ${{cancelled()}}
        run: echo "I'll print if the workflow has been cancelled"