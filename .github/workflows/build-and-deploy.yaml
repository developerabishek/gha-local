name: Build and deploy
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
jobs:
  build-docker-images:
    runs-on: ubuntu-latest
    steps:
      - name: check docker status
        run: |
          docker build -t hello:${{ github.event.inputs.version }} .
          docker images
          docker run hello:${{ github.event.inputs.version }}

